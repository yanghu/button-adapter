name: Build QMK / Vial Firmware

on:
  push:
    branches: [ main ]
    paths:
      - 'firmware/**'
      - '.github/workflows/build-firmware.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/build-firmware.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-vial-uf2:
    name: Compile button_adapter (Vial & Default .uf2)
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli@sha256:2dc05fc9f32efebd6b05c2b8676ee548358bc7e151e9dbf4dac6b6eed4513b07

    steps:
      - name: Checkout button-adapter repository
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Checkout vial-kb/vial-qmk (vial branch)
        uses: actions/checkout@v4
        with:
          repository: vial-kb/vial-qmk
          ref: vial
          path: vial-qmk
          fetch-depth: 1
          submodules: recursive

      - name: Overlay button_adapter keyboard definition
        run: |
          rm -rf vial-qmk/keyboards/button_adapter
          cp -r repo/firmware/keyboards/button_adapter vial-qmk/keyboards/button_adapter

      - name: Validate Vial JSON & compile firmware (.uf2)
        working-directory: vial-qmk
        run: |
          git config --global --add safe.directory '*'
          python3 -m json.tool keyboards/button_adapter/keyboard.json >/dev/null
          python3 -m json.tool keyboards/button_adapter/keymaps/vial/vial.json >/dev/null
          qmk compile -j "$(nproc)" -kb button_adapter -km vial
          qmk compile -j "$(nproc)" -kb button_adapter -km default
          ls -lh button_adapter_vial.uf2 button_adapter_default.uf2

      - name: Stage UF2 artifacts
        run: |
          mkdir -p artifacts
          cp vial-qmk/button_adapter_vial.uf2 artifacts/
          cp vial-qmk/button_adapter_default.uf2 artifacts/
          sha256sum artifacts/*.uf2 > artifacts/SHA256SUMS.txt
          cat artifacts/SHA256SUMS.txt

      - name: Upload compiled UF2 firmware
        uses: actions/upload-artifact@v4
        with:
          name: button-adapter-firmware-uf2
          path: artifacts/
          if-no-files-found: error
